version: "2"

sql:
  - engine: "postgresql"
    schema: "sql/migrations"
    queries: "sql/queries"
    gen:
      go:
        package: "database"
        out: "internal/platform/database"
        sql_package: "pgx/v5"

        # Interface generation for mocking and dependency injection
        emit_interface: true

        # JSON Serialization
        emit_json_tags: true
        json_tags_case_style: "camel"

        emit_pointers_for_null_types: true

        emit_db_tags: true

        emit_prepared_queries: true

        # Overrides for different extensions
        overrides:
          # Map ltree to go strings
          - db_type: "ltree"
            nullable: false
            go_type: "string"
          - db_type: "ltree"
            nullable: true
            go_type:
              type: "string"
              pointer: true

          # Using google UUID
          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
